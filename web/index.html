<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PASS Results Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎓 Predictive Academic Success System (PASS)</h1>

    <section class="summary">
      <h2>Current Summary</h2>
      <p><strong>Total Students:</strong> <span id="total">50</span></p>
      <p><strong>Average Grade:</strong> <span id="avg">78.4</span></p>
      <p><strong>Success Rate:</strong> <span id="rate">68%</span></p>
    </section>

    <section class="chart">
      <h2>Performance Chart (Demo)</h2>
      <img src="https://placehold.co/600x300?text=Chart+Coming+Soon" alt="Chart placeholder" />
    </section>

    <footer>
      <p>PASS Research Project © 2025</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
